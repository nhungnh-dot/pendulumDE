name: Run Q2 experiment

on:
  push:
    paths:
      - ".github/workflows/run-q2.yml"

permissions:
  contents: write

jobs:
  q2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Question 2 experiments
        run: python run_experiments.py --mode q2 --out experiment_results/q2.json
      - name: Commit result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(base64 -w0 experiment_results/q2.json)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/experiment_results/q2.json" \
            -f message="Record Question 2 experiment results" \
            -f content="$CONTENT" \
            -f branch="main"
