name: One-time Colab loss notation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace calligraphic loss notation with Colab-safe L
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('coupled_pendulum_lesson.ipynb')
          text = path.read_text(encoding='utf-8')
          text = text.replace(r'\\mathcal{L}', 'L')
          text = text.replace(r'\\mathcal L', 'L')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit notebook fix and remove this workflow
        run: |
          rm .github/workflows/fix_colab_loss_font.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coupled_pendulum_lesson.ipynb .github/workflows/fix_colab_loss_font.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Use Colab-safe loss notation"
          git push
