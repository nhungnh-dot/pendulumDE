name: Rebuild undamped lesson from damped lesson

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild-notebook:
    if: github.event.head_commit.message == 'Trigger undamped lesson alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python rebuild_undamped_from_damped.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Align undamped lesson with damped lesson structure
          file_pattern: coupled_pendulum_no_damping_lesson.ipynb
