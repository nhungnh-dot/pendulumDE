name: Run Q3 experiments

on:
  push:
    paths:
      - ".github/workflows/run-q3.yml"

permissions:
  contents: write

jobs:
  q3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lambda_p: "0.0"
            label: "0"
          - lambda_p: "0.5"
            label: "0p5"
          - lambda_p: "2.0"
            label: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run Question 3 experiment
        run: python run_experiments.py --mode q3 --nfreq 30 --lambda-p ${{ matrix.lambda_p }} --k0 1.0 --out experiment_results/q3_lambda_${{ matrix.label }}.json
      - name: Commit result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="experiment_results/q3_lambda_${{ matrix.label }}.json"
          CONTENT=$(base64 -w0 "$FILE")
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/$FILE" \
            -f message="Record Question 3 result for lambda=${{ matrix.lambda_p }}" \
            -f content="$CONTENT" \
            -f branch="main"
