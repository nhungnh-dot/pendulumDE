name: Move spiky loss note

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-notebook:
    if: github.event.head_commit.message == 'Trigger move of spiky loss note'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python move_spiky_loss_note.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Move spiky loss explanation after loss graphs
          file_pattern: coupled_pendulum_lesson.ipynb
