name: Remove lambda sentence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-notebook:
    if: github.event.head_commit.message == 'Trigger lambda sentence removal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python remove_lambda_sentence.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Remove default lambda sentence from loss explanation
          file_pattern: coupled_pendulum_lesson.ipynb
