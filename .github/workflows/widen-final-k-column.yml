name: Widen Final K column

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-notebooks:
    if: github.event.head_commit.message == 'Trigger Final K column widening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python widen_final_k_column.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Widen Final K column in Question 3 tables
          file_pattern: coupled_pendulum_lesson.ipynb coupled_pendulum_no_damping_lesson.ipynb
