name: Apply pendulum lesson feedback

on:
  push:
    branches: [main]
    paths:
      - patch_feedback_revision.py
      - .github/workflows/apply-pendulum-feedback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply lesson patch
        run: python patch_feedback_revision.py

      - name: Commit updated notebook
        run: |
          if git diff --quiet -- coupled_pendulum_lesson.ipynb; then
            echo "No notebook changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coupled_pendulum_lesson.ipynb
          git commit -m "Revise pendulum lesson from student feedback"
          git push
