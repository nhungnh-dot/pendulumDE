name: Expand loss explanations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-notebook:
    if: github.event.head_commit.message == 'Trigger detailed loss explanation revision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python expand_loss_explanations.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Expand data and physics loss explanations
          file_pattern: coupled_pendulum_lesson.ipynb
